name: 公開サーバー接続確認
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-wss:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.12.0'
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile --prod
      - run: node scripts/public-smoke.mjs
