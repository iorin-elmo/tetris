# Caddyの代わりにnginxを使う場合の例。証明書を取得してから有効化してください。
server {
    listen 443 ssl;
    server_name tetris.server-on.net;
    ssl_certificate /etc/letsencrypt/live/tetris.server-on.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tetris.server-on.net/privkey.pem;
    location = /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /health { proxy_pass http://127.0.0.1:3001; }
    location / { return 404; }
}
